<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
#root { font-family: 'DM Sans', var(--font-sans); padding: 2rem 0 3rem; max-width: 620px; margin: 0 auto; }

.pbar-label { font-size: 13px; color: var(--color-text-tertiary); white-space: nowrap; min-width: 44px; text-align: right; }
.stats-strip { display: flex; gap: 8px; margin-bottom: 2rem; }
.stat-chip { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 12px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-tertiary); background: var(--color-background-primary); }
.stat-chip i { font-size: 16px; }
.stat-chip .val { font-size: 18px; font-weight: 500; }

.stat-chip.green { background: #E1F5EE; border-color: #5DCAA5; }

.opt.correct { background: #E1F5EE; border-color: #1D9E75; }

  document.getElementById('pbar').style.width=Math.round(idx/total*100)+'%';
  document.getElementById('pbar-label').textContent=Math.round(idx/total*100)+'%';
  document.getElementById('q-tag').textContent='Câu '+(idx+1)+' / '+total;
  document.getElementById('q-text').textContent=q['Câu hỏi'];
  const fb=document.getElementById('fb');
  fb.className='feedback-bar';fb.innerHTML='';
  document.getElementById('btn-next').disabled=true;
  document.getElementById('btn-prev').disabled=idx===0;
  const opts=document.getElementById('q-opts');
  opts.innerHTML='';
  Object.entries(q['Options']).forEach(([k,v])=>{
    const btn=document.createElement('button');
    btn.className='opt';
    btn.innerHTML='<span class="badge">'+k+'</span><span class="opt-txt">'+v+'</span>';
    btn.onclick=()=>pick(k,q['Answer']);
    opts.appendChild(btn);
  });
}

function pick(chosen,ans){
  if(answered)return;
  answered=true;
  const isOk=chosen===ans;
  if(isOk)cor++;else wrg++;
  results[idx]={q:deck[idx],chosen,ans,ok:isOk};
  document.getElementById('sv-cor').textContent=cor;
  document.getElementById('sv-wrg').textContent=wrg;
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    const ltr=b.querySelector('.badge').textContent;
    if(ltr===ans) b.classList.add(chosen===ans?'correct':'reveal');
    else if(ltr===chosen&&!isOk) b.classList.add('wrong');
  });
  const fb=document.getElementById('fb');
  if(isOk){
    fb.innerHTML='<i class="ti ti-circle-check" style="font-size:18px;color:#1D9E75" aria-hidden="true"></i> Chính xác!';
    fb.className='feedback-bar ok show';
  } else {
    fb.innerHTML='<i class="ti ti-circle-x" style="font-size:18px;color:#E24B4A" aria-hidden="true"></i> Sai rồi — đáp án đúng là <strong>'+ans+'</strong>';
    fb.className='feedback-bar no show';
  }
  document.getElementById('btn-next').disabled=false;
}

function go(dir){
  idx+=dir;
  if(idx<0)idx=0;
  render();
}

function showEnd(){
  document.getElementById('quiz-view').style.display='none';
  document.getElementById('end-view').style.display='block';
  document.getElementById('pbar').style.width='100%';
  document.getElementById('pbar-label').textContent='100%';
  const total=deck.length,pct=Math.round(cor/total*100);
  document.getElementById('end-pct').textContent=pct+'%';
  const titles=pct>=80?'Xuất sắc!':pct>=60?'Khá tốt!':'Cần ôn thêm!';
  document.getElementById('end-title').textContent=titles;
  document.getElementById('end-detail').textContent='Đúng '+cor+' / '+total+' câu · Sai '+wrg+' câu';
  const wrongList=results.filter(r=>r&&!r.ok);
  document.getElementById('btn-review-wrong').disabled=wrongList.length===0;
  const box=document.getElementById('review-box');
  box.innerHTML='';
  if(wrongList.length>0){
    const h=document.createElement('div');
    h.className='review-header';h.textContent='Câu sai ('+wrongList.length+')';
    box.appendChild(h);
    wrongList.forEach(r=>{
      const d=document.createElement('div');
      d.className='review-card';
      d.innerHTML='<div class="review-q">'+r.q['Câu hỏi']+'</div>'+
        '<div class="review-row"><span class="dot dot-no"><i class="ti ti-x" style="font-size:9px" aria-hidden="true"></i></span><span class="txt-no">'+r.chosen+': '+r.q['Options'][r.chosen]+'</span></div>'+
        '<div class="review-row"><span class="dot dot-ok"><i class="ti ti-check" style="font-size:9px" aria-hidden="true"></i></span><span class="txt-ok">'+r.ans+': '+r.q['Options'][r.ans]+'</span></div>';
      box.appendChild(d);
    });
  }
}

function restart(wrongOnly){
  if(wrongOnly){
    const w=results.filter(r=>r&&!r.ok).map(r=>r.q);
    if(!w.length)return;
    deck=w;document.getElementById('sv-total').textContent=w.length;
  } else {
    deck=[...ALL];document.getElementById('sv-total').textContent=ALL.length;
  }
  idx=0;cor=0;wrg=0;
  results=new Array(deck.length).fill(null);
  document.getElementById('sv-cor').textContent=0;
  document.getElementById('sv-wrg').textContent=0;
  document.getElementById('end-view').style.display='none';
  document.getElementById('quiz-view').style.display='block';
  render();
}

render();
</script>
